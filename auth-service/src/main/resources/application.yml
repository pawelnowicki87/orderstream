server:
  # Railway injects PORT for services with a public domain.
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: orderstream
    password: orderstream
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

orderstream:
  jwt:
    # Must be at least 32 bytes for HS256. The SAME value must be set in api-gateway.
    secret: "change-me-in-production-orderstream-demo-secret-key-2026"
    expiration-minutes: 120
