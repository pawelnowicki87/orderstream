server:
  # Railway injects PORT for services with a public domain.
  port: ${PORT:8082}

spring:
  application:
    name: restaurant-service
  datasource:
    url: jdbc:postgresql://localhost:5433/restaurant_db
    username: orderstream
    password: orderstream
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

grpc:
  server:
    port: 9090
    # '*' binds every interface. Railway's private network is IPv6, so if the client
    # cannot reach this server there, set GRPC_SERVER_ADDRESS to "::".
    address: ${GRPC_SERVER_ADDRESS:*}
