services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orderstream
      POSTGRES_PASSWORD: orderstream
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  auth-service:
    build: ./auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      postgres:
        condition: service_healthy

  restaurant-service:
    build: ./restaurant-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/restaurant_db
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRPC_CLIENT_RESTAURANT-SERVICE_ADDRESS: "static://restaurant-service:9090"
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      restaurant-service:
        condition: service_started

  notification-service:
    build: ./notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      kafka:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      ORDERSTREAM_SERVICES_AUTH: http://auth-service:8081
      ORDERSTREAM_SERVICES_RESTAURANT: http://restaurant-service:8082
      ORDERSTREAM_SERVICES_ORDER: http://order-service:8083
      ORDERSTREAM_CORS_ALLOWED-ORIGIN: http://localhost:4300
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      - auth-service
      - restaurant-service
      - order-service

  frontend:
    build: ./frontend
    ports:
      - "4300:80"
    depends_on:
      - api-gateway

volumes:
  postgres-data:
