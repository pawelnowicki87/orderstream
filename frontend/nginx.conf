server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The production build uses relative URLs (see src/app/core/api.config.ts),
    # so everything must be reachable from this one origin.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket upgrade: without HTTP/1.1 and these two headers the STOMP
    # handshake fails silently and live tracking never updates.
    location /ws {
        proxy_pass http://notification-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
