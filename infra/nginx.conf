# Reverse proxy for the API host (for example api.orderstream.pl).
#
# The browser app itself is served by Vercel; this server only carries the REST API and the
# WebSocket. Certbot rewrites this file when it installs the certificate, adding the TLS
# listener and the redirect from port 80.
#
#   cp infra/nginx.conf /etc/nginx/sites-available/orderstream
#   ln -s /etc/nginx/sites-available/orderstream /etc/nginx/sites-enabled/orderstream
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.<your-domain>

server {
    listen 80;
    server_name api.example.com;   # replace with your API host

    # Nothing is served from this host directly — it is an API endpoint.
    location = / {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket upgrade: without HTTP/1.1 and these two headers the STOMP handshake
    # fails silently and live tracking never updates.
    location /ws {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
